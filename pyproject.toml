[project]
name = "e500"
version = "0.0.1"
description = "Battery health monitor for the 2013-2019 Fiat 500e, over a CAN OBD adapter"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
e500 = "e500.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e500"]

[tool.pytest.ini_options]
testpaths = ["tests"]
